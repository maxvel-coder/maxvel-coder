<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  body { font-family: "Segoe UI", system-ui, sans-serif; }
  .art { display: none; } .art.on { display: block; }
</style></head>
<body>
<!-- art.html?a=avatar|banner|cover — rendered to PNG by render.ps1 -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#a66bff"/></linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f6f9ff"/><stop offset="1" stop-color="#eef1ff"/></linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3fa9ff"/><stop offset="1" stop-color="#7b6bff"/></linearGradient>
    <!-- game controller, 200 x 130, white line art -->
    <g id="pad">
      <path d="M52 12h96c26 0 44 18 49 46l3 26c4 28-22 44-40 26l-20-20H60L40 110C22 128-4 112 0 84l3-26C8 30 26 12 52 12z" fill="none" stroke="currentColor" stroke-width="10" stroke-linejoin="round"/>
      <path d="M52 44v32M36 60h32" stroke="currentColor" stroke-width="10" stroke-linecap="round"/>
      <circle cx="140" cy="48" r="8" fill="currentColor"/><circle cx="160" cy="68" r="8" fill="currentColor"/>
    </g>
    <path id="spark" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14z"/>
  </defs>
</svg>

<!-- avatar 512 × 512 -->
<svg class="art" id="avatar" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="120" fill="url(#g1)"/>
  <circle cx="400" cy="110" r="150" fill="#ffffff" opacity=".10"/>
  <circle cx="90" cy="440" r="120" fill="#ffffff" opacity=".08"/>
  <use href="#pad" x="146" y="196" style="color:#fff" transform="translate(-40 -26) scale(1.2)"/>
  <g fill="#ffe27a"><use href="#spark" x="390" y="150" transform="translate(390 150) scale(1.5) translate(-390 -150)"/><use href="#spark" x="128" y="140"/></g>
  <text x="256" y="430" text-anchor="middle" font-size="58" font-weight="800" fill="#fff" letter-spacing="2" font-family="Consolas, monospace">&lt;/&gt;</text>
</svg>

<!-- GitHub profile banner 1280 × 320 -->
<svg class="art" id="banner" width="1280" height="320" viewBox="0 0 1280 320">
  <rect width="1280" height="320" rx="28" fill="url(#g2)"/>
  <path d="M760 300 C 860 230 900 120 1010 110 S 1180 170 1260 40" fill="none" stroke="#dfe5ff" stroke-width="34" stroke-linecap="round"/>
  <path d="M760 300 C 860 230 900 120 1010 110 S 1180 170 1260 40" fill="none" stroke="url(#road)" stroke-width="12" stroke-linecap="round" stroke-dasharray="1 0"/>
  <g transform="translate(1010 110) rotate(-10)"><circle r="26" fill="#3fa9ff33"/><path d="M0-17 12 13 0 7-12 13z" fill="#3fa9ff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
  <g transform="translate(840 40) scale(.62)" style="color:#7b6bff"><use href="#pad"/></g>
  <text x="1150" y="270" font-size="54" font-weight="800" fill="#5b8cff" font-family="Consolas, monospace">&lt;/&gt;</text>
  <g fill="#ffc94a"><use href="#spark" x="0" y="0" transform="translate(1180 92)"/><use href="#spark" transform="translate(800 250) scale(.8)"/><use href="#spark" transform="translate(1060 230) scale(.6)"/></g>
  <text x="64" y="118" font-size="54" font-weight="800" fill="#1d2433">Hi, I'm Maxvel</text>
  <text x="64" y="172" font-size="27" fill="#4a5568">I build cool features for games,</text>
  <text x="64" y="208" font-size="27" fill="#4a5568">and for anything else that's fun to make.</text>
  <g font-size="19" font-weight="600">
    <rect x="64" y="236" width="182" height="40" rx="20" fill="#5b8cff1f"/><text x="155" y="262" text-anchor="middle" fill="#3b6fe6">ATS Co-Driver</text>
    <rect x="258" y="236" width="140" height="40" rx="20" fill="#a66bff1f"/><text x="328" y="262" text-anchor="middle" fill="#8a4fe8">game tools</text>
    <rect x="410" y="236" width="150" height="40" rx="20" fill="#ffc94a2e"/><text x="485" y="262" text-anchor="middle" fill="#b07a00">experiments</text>
  </g>
</svg>

<!-- Buy Me a Coffee cover 1600 × 400 -->
<svg class="art" id="cover" width="1600" height="400" viewBox="0 0 1600 400">
  <rect width="1600" height="400" fill="url(#g2)"/>
  <circle cx="1460" cy="40" r="220" fill="#a66bff" opacity=".08"/><circle cx="120" cy="390" r="200" fill="#5b8cff" opacity=".08"/>
  <path d="M-20 330 C 220 300 330 170 560 180 S 900 320 1120 250 1460 90 1640 120" fill="none" stroke="#dfe5ff" stroke-width="40" stroke-linecap="round"/>
  <path d="M-20 330 C 220 300 330 170 560 180 S 900 320 1120 250 1460 90 1640 120" fill="none" stroke="url(#road)" stroke-width="14" stroke-linecap="round"/>
  <g transform="translate(560 180) rotate(80)"><circle r="30" fill="#3fa9ff33"/><path d="M0-20 14 15 0 8-14 15z" fill="#3fa9ff" stroke="#fff" stroke-width="3" stroke-linejoin="round"/></g>
  <g transform="translate(1230 60) scale(.8)" style="color:#7b6bff"><use href="#pad"/></g>
  <text x="250" y="110" font-size="64" font-weight="800" fill="#5b8cff" font-family="Consolas, monospace">&lt;/&gt;</text>
  <!-- coffee cup -->
  <g transform="translate(980 70)">
    <path d="M10 40h120l-12 112c-2 14-12 22-26 22H48c-14 0-24-8-26-22z" fill="#fff" stroke="#1d2433" stroke-width="8" stroke-linejoin="round"/>
    <path d="M130 66h14c18 0 26 12 24 26s-14 24-32 24h-8" fill="none" stroke="#1d2433" stroke-width="8"/>
    <path d="M30 70h92" stroke="#ffc94a" stroke-width="14" stroke-linecap="round"/>
    <path d="M50 22c-8-10 8-16 0-26M76 22c-8-10 8-16 0-26M102 22c-8-10 8-16 0-26" fill="none" stroke="#a0aec0" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g fill="#ffc94a"><use href="#spark" transform="translate(1180 230)"/><use href="#spark" transform="translate(420 70) scale(.8)"/><use href="#spark" transform="translate(1500 300) scale(1.2)"/><use href="#spark" transform="translate(150 120) scale(.7)"/></g>
</svg>

<script>document.getElementById(new URLSearchParams(location.search).get('a') || 'avatar').classList.add('on');</script>
</body></html>
